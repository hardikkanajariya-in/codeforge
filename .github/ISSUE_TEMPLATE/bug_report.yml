name: Bug report
description: Report a bug in CodeForge Database Studio
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
    validations:
      required: true

  - type: input
    id: filament-version
    attributes:
      label: Filament version
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: CodeForge Database Studio version
    validations:
      required: true
